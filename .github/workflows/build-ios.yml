# Builds Metrodroid for iOS and uploads an .ipa as a workflow artifact.
#
# Put this file in your fork at .github/workflows/build-ios.yml, then run it from
# the Actions tab ("Build iOS IPA" -> "Run workflow").
#
# Two modes:
#  * No signing secrets set (default): builds the app and ad-hoc signs it with the
#    NFC entitlement embedded, producing metrodroid-adhoc.ipa. Re-sign and install
#    it from Windows with Sideloadly using your paid Apple developer account.
#  * Signing secrets set (IOS_CERT_P12_BASE64, IOS_CERT_PASSWORD,
#    IOS_PROFILE_BASE64, IOS_TEAM_ID, IOS_BUNDLE_ID): signs with your own
#    Apple Development certificate + provisioning profile, producing
#    metrodroid-signed.ipa that installs as-is on the devices in the profile.

name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Xcode build configuration
        default: Release
        type: choice
        options: [Release, Debug]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CONFIGURATION: ${{ inputs.configuration || 'Release' }}
      HAS_SIGNING: ${{ secrets.IOS_CERT_P12_BASE64 != '' && secrets.IOS_PROFILE_BASE64 != '' }}

    steps:
      - name: Check out (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0   # build.gradle derives versionCode/versionName from git history

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Restrict NFC entitlement to TAG
        # Apple no longer issues provisioning profiles with the NDEF value, so
        # keeping it makes signing fail with an entitlement mismatch.
        run: |
          ENT=native/metrodroid/metrodroid/metrodroid.entitlements
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.nfc.readersession.formats" "$ENT"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.nfc.readersession.formats array" "$ENT"
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.nfc.readersession.formats:0 string TAG" "$ENT"
          cat "$ENT"

      - name: Pre-build Kotlin framework and localized strings
        # Xcode's own "run Gradle" script phase generates .strings files that a
        # later copy phase reads, but Xcode doesn't know that and runs them in
        # parallel. Generating everything up front avoids the race; the script
        # phase then finds all Gradle tasks up to date.
        env:
          SDK_NAME: iphoneos   # makes build.gradle target ios_arm64 (device)
          IPHONEOS_DEPLOYMENT_TARGET: '13.0'
        run: |
          # proto/build.gradle passes no -isysroot for the device target; inside
          # Xcode clang picks the iOS SDK up from SDKROOT, so mirror that here.
          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDKROOT=$SDKROOT"
          ./gradlew :proto:mainSharedLibrary
          ./gradlew :proto:mainStaticLibrary
          ./gradlew :generateLocalize :iOSLanguages :iOSMappedLanguages
          ./gradlew :packForXCode -PXCODE_CONFIGURATION="$CONFIGURATION"
          ls native/metrodroid/metrodroid/metrodroid/*.lproj/InfoPlist.strings
          ls build/xcode-frameworks

      - name: Install signing certificate and profile
        if: env.HAS_SIGNING == 'true'
        env:
          P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profile.plist")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"
          echo "Installed profile $UUID"

      - name: Build app (signed)
        if: env.HAS_SIGNING == 'true'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
        run: |
          xcodebuild \
            -project native/metrodroid/metrodroid.xcodeproj \
            -target metrodroid \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            SYMROOT="$PWD/build/xcode" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            build

      - name: Build app (unsigned)
        if: env.HAS_SIGNING != 'true'
        run: |
          xcodebuild \
            -project native/metrodroid/metrodroid.xcodeproj \
            -target metrodroid \
            -configuration "$CONFIGURATION" \
            -sdk iphoneos \
            SYMROOT="$PWD/build/xcode" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Ad-hoc sign with NFC entitlement
        if: env.HAS_SIGNING != 'true'
        # Sideloadly re-signs the app, but it takes the entitlements from the
        # existing signature, so embed them here.
        run: |
          APP="build/xcode/$CONFIGURATION-iphoneos/metrodroid.app"
          if [ -d "$APP/Frameworks" ]; then
            find "$APP/Frameworks" -maxdepth 1 \( -name '*.framework' -o -name '*.dylib' \) \
              -exec codesign --force --sign - {} \;
          fi
          codesign --force --sign - \
            --entitlements native/metrodroid/metrodroid/metrodroid.entitlements \
            "$APP"
          codesign -d --entitlements :- "$APP"

      - name: Package IPA
        run: |
          APP="build/xcode/$CONFIGURATION-iphoneos/metrodroid.app"
          test -d "$APP" || { echo "App not found at $APP"; ls -R build/xcode | head -50; exit 1; }
          NAME=$([ "$HAS_SIGNING" = "true" ] && echo metrodroid-signed || echo metrodroid-adhoc)
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload "$NAME.ipa"
          echo "IPA_NAME=$NAME" >> "$GITHUB_ENV"
          ls -lh "$NAME.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ env.IPA_NAME }}.ipa
          if-no-files-found: error
